[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topogame"
version = "0.1.0"
description = "Random terrain, topographic maps, and cardinal-direction camera images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "pyvista>=0.49,<0.50", "vtk>=9.5,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
topogame = "topogame.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["render: exercises the off-screen OpenGL renderer"]
